name: Full-Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Node + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: backend
      - name: Run Vitest API tests
        run: npm test
        working-directory: backend

  frontend-test:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile_frontend
      - name: Run Flutter unit tests
        run: flutter test
        working-directory: mobile_frontend

  deploy-backend:
    name: Deploy Backend to Render
    needs: [ backend-test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: curl -f -X POST "https://api.render.com/deploy/srv-da5dubojo6nc73c9jugg?key=ptoSPS2PvrM"
